<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#1A1A1D;
       font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center}
  /* Everything sits inside the centre 630x630 so a square crop (Teams, Slack)
     still shows the duck and the wordmark. */
  .box{width:600px;display:flex;flex-direction:column;align-items:center;text-align:center}
  svg{width:210px;height:210px;display:block}
  .name{margin-top:26px;font-size:62px;font-weight:700;letter-spacing:-.025em;color:#ECECEE;line-height:1}
  .name span{color:#9A9AA2;font-weight:400}
  .rule{width:86px;height:5px;border-radius:3px;background:#FFC83D;margin:26px 0 22px}
  .tag{font-size:25px;line-height:1.4;color:#9A9AA2;max-width:560px}
</style></head>
<body>
  <div class="box">
    <svg viewBox="0 0 64 64">
      <g transform="translate(6 7.2) scale(0.8)">
        <path d="M13 36 2 27l10 21z" fill="#ECECEE"/>
        <ellipse cx="28" cy="41" rx="21" ry="13" fill="#ECECEE"/>
        <circle cx="41" cy="21" r="13" fill="#ECECEE"/>
        <path d="M50 21.5h11.3c1.9 0 2.9 2.2 1.7 3.7l-2.5 3.1c-.6.8-1.6 1.2-2.6 1.2H50z" fill="#FFC83D"/>
        <clipPath id="bdhead"><circle cx="41" cy="21" r="13"/></clipPath>
        <path clip-path="url(#bdhead)" d="M29.6 13.4 52 17.5c1.4.3 2 1.9 1 2.9l-1.7 1.7c-.5.5-1.2.8-1.9.8h-4.3c-1.6 0-2.8-1.3-2.8-2.9v-.5l-2.4-.4v.8c0 1.7-1.5 3-3.2 2.7l-4.7-.7c-1.4-.2-2.4-1.4-2.4-2.8v-3.2c0-1.6 1.5-2.8 3-2.5z" fill="#141418"/>
      </g>
    </svg>
    <div class="name">Bad Duck <span>Software</span></div>
    <div class="rule"></div>
    <div class="tag">Small, focused tools for people who spend too much time in meetings.</div>
  </div>
</body></html>
